server:
  forward-headers-strategy: framework

# ==========================================
# 1. Firebase 설정 (수정됨)
# ==========================================
firebase:
  # 중요: 로컬에서는 이 환경변수가 없어도 에러가 안 나도록 ':#{null}'을 붙여야 합니다.
  # 의미: 환경변수가 있으면 쓰고, 없으면 null로 처리해라.
  key-json: ${FIREBASE_KEY_BASE64:#{null}}

# ==========================================
# 2. Supabase 설정 (추가됨)
# ==========================================
supabase:
  # 백엔드에서 관리자 권한(Service Key)을 쓰기 위해 필요합니다.
  url: ${SUPABASE_URL}
  service-key: ${SUPABASE_SERVICE_KEY}

spring:
  profiles:
    active: local
  application:
    name: CP_Main_BE
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    debug: true
  config:
    import: "optional:dotenv:.env.properties" # .env 파일 명시 (로컬 실행 시 편리)

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-milliseconds: 5256000000
  refresh-token-expiration-milliseconds: 10512000000

# R2는 Supabase Storage로 완전히 넘어가면 나중에 삭제하세요.
cloudflare:
  r2:
    endpoint: ${R2_ENDPOINT}
    bucket: ${R2_BUCKET}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    account-id: ${R2_ACCOUNT_ID}
    public-url: ${R2_PUBLIC_URL:}
aws:
  s3:
    bucket: cp-main-bucket

google:
  gemini:
    api-key: ${GEMINI_API_KEY}
    image-model: ${GEMINI_IMAGE_MODEL:gemini-2.5-flash-image}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

replicate:
  api:
    token: ${REPLICATE_API_TOKEN}
    base-url: ${REPLICATE_BASE_URL:https://api.replicate.com}
  rembg:
    model: ${REPLICATE_REMBG_MODEL:cjwbw/rembg}
    version: ${REPLICATE_REMBG_VERSION:fb8af171cfa1616ddcf1242c093f9c46bcada5ad4cf6f2fbe8b81b330ec5c003}

avatar:
  generation:
    timeout-seconds: ${AVATAR_GENERATION_TIMEOUT_SECONDS:300}
  reference:
    validate: true

logging:
  level:
    org:
      springframework:
        security: TRACE

random:
  feed:
    session:
      store: memory

notification:
  debug:
    enabled: false
    sample-rate: 1.0

user:
  last-accessed:
    update-minutes: 10

---
# ==========================================
# Local Profile (로컬 Supabase 연결)
# ==========================================
spring:
  config:
    activate:
      on-profile: local
  datasource:
    # 터미널에 나온 DB URL (포트 54322 확인!)
    url: jdbc:postgresql://127.0.0.1:54322/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update # 로컬 개발용
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 로컬 Supabase API 설정
supabase:
  url: http://127.0.0.1:54321
  service-key: ${LOCAL_SERVICE_KEY} # .env에서 가져옵니다

# 로컬용 JWT 설정
jwt:
  secret: ${LOCAL_JWT_SECRET} # .env에서 가져옵니다

# 로컬 개발 시 AI 기능 키가 없어도 기동 가능하도록 설정
google:
  gemini:
    api-key: ${GEMINI_API_KEY:local-dummy-key}
replicate:
  api:
    token: ${REPLICATE_API_TOKEN:local-dummy-token}
avatar:
  reference:
    validate: false
---
# ==========================================
# Prod Profile (Railway + Supabase)
# ==========================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 운영 환경에서는 update가 위험할 수 있습니다.
      # 테이블이 이미 확정되었다면 'validate'를, 아직 개발 중이라면 'update'를 쓰세요.
      ddl-auto: update
    show-sql: false # 운영 로그 지저분해짐 방지
  security:
    debug: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false

springdoc:
  swagger-ui:
    servers:
      - url: https://api.napulnapul.com
        description: Production Server

logging:
  level:
    org.hibernate.SQL: INFO # 운영에서는 쿼리 로그를 INFO로 줄이는 게 좋습니다.
