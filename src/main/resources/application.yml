server:
  forward-headers-strategy: framework

spring:
  profiles:
    active: local
  application:
    name: CP_Main_BE
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    debug: true
  config:
    import: "optional:dotenv:"

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-milliseconds: 5256000000
  refresh-token-expiration-milliseconds: 10512000000

cloudflare:
  r2:
    endpoint: ${R2_ENDPOINT}
    bucket: ${R2_BUCKET}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    account-id: ${R2_ACCOUNT_ID}
aws:
  s3:
    bucket: cp-main-bucket

fastapi:
  server:
    url: ${FASTAPI_URL}

logging:
  level:
    org:
      springframework:
        security: TRACE

---
# ==========================================
# Local Profile (여기서 파일 생성 설정 추가됨)
# ==========================================
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    # ▼▼▼ 추가된 설정: 로컬 실행 시 DDL 파일 생성 ▼▼▼
    properties:
      jakarta: # Spring Boot 2.x라면 'jakarta'를 'javax'로 변경하세요
        persistence:
          schema-generation:
            scripts:
              action: create
              create-target: ./entity-schema.sql # 프로젝트 루트에 파일 생성
              create-source: metadata
  h2:
    console:
      enabled: true
      path: /h2-console

---
# ==========================================
# Prod Profile
# ==========================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  security:
    debug: false

springdoc:
  swagger-ui:
    servers:
      - url: https://api.napulnapul.com
        description: Production Server

logging:
  level:
    # 실행되는 SQL문을 DEBUG 레벨로 출력
    org.hibernate.SQL: DEBUG
    # SQL에 바인딩되는 파라미터 값을 TRACE 레벨로 출력
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE