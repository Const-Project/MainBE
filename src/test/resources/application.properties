# Spring H2 & JPA Test Config
spring:
datasource:
url: jdbc:h2:mem:testdb
driver-class-name: org.h2.Driver
username: sa
password:
jpa:
database-platform: org.hibernate.dialect.H2Dialect
hibernate:
ddl-auto: create-drop
show-sql: true

# Cloudflare R2
cloudflare.r2.endpoint: ${R2_ENDPOINT}
cloudflare.r2.bucket: ${R2_BUCKET}
cloudflare.r2.access-key: ${R2_ACCESS_KEY}
cloudflare.r2.secret-key: ${R2_SECRET_KEY}


# Replicate API
replicate.api.token: ${API_TOKEN}
replicate.api.url: https://api.replicate.com

# JWT
jwt.secret: ${JWT_SECRET}
jwt.access-token-expiration-milliseconds: 3600000
jwt.refresh-token-expiration-milliseconds: 604800000